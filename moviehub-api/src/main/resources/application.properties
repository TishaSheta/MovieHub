spring.application.name=moviehub-api
server.port=${PORT:8080}
server.error.include-message=always

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/moviehub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}

# Creates/updates tables from the entities. Fine for learning.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Must be at least 32 characters. Override with the JWT_SECRET env var in production.
jwt.secret=${JWT_SECRET:QwYt+vW8HRgt}
jwt.expiration-ms=86400000

# Comma-separated list of frontend URLs allowed to call this API
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
